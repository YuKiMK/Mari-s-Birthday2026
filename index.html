<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>鞠莉お嬢様からのメッセージ 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --gold: #f5c842;
    --gold-light: #ffe98a;
    --gold-dark: #c8960a;
    --pink: #ff7eb3;
    --purple: #a259f7;
    --text-dark: #3a1a5e;
    --white: #ffffff;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #1a0533;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(162,89,247,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(255,126,179,0.1) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(245,200,66,0.05) 0%, transparent 70%);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.2rem 3rem;
    position: relative;
    overflow-x: hidden;
  }

  /* 星（少なめ・暗め） */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.4; transform: scale(1); }
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.8rem;
  }

  /* ヘッダー */
  .header { text-align: center; }

  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, #555, #888, #aaa, #888);
    color: rgba(255,255,255,0.7);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 0.4rem 1.4rem;
    border-radius: 99px;
    margin-bottom: 1.1rem;
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
  }

  .title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    line-height: 1.45;
    margin-bottom: 0.7rem;
  }

  .title span.gold { color: rgba(255,233,138,0.5); }

  .subtitle {
    font-size: 0.92rem;
    color: rgba(255,255,255,0.35);
    line-height: 1.7;
  }

  /* メインカード */
  .card {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 2.8rem 1.8rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  /* 南京錠アイコン */
  .lock-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    margin: 0 auto 1.6rem;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
  }

  .lock-icon svg {
    width: 36px;
    height: 36px;
    stroke: rgba(255,255,255,0.35);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .closed-title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1.2rem, 5vw, 1.6rem);
    color: rgba(255,255,255,0.55);
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
  }

  .closed-desc {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.38);
    line-height: 1.9;
    margin-bottom: 2rem;
  }

  .deco-border {
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    margin: 0 auto 1.8rem;
  }

  .thanks-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.95rem;
    color: rgba(255,233,138,0.45);
    line-height: 2;
  }

  .logo-area {
    text-align: center;
    color: rgba(255,255,255,0.15);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    padding-top: 0.3rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.5rem 1rem 2.5rem; }
    .card { padding: 2.2rem 1.2rem; border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="stars" id="starsContainer"></div>

<div class="container">

  <div class="header">
    <div class="header-badge">✦ MARI'S BIRTHDAY EVENT 2026 ✦</div>
    <h1 class="title">鞠莉お嬢様からの<br><span class="gold">特別なメッセージ</span></h1>
    <p class="subtitle">謎解きを制覇した、あなただけへ…</p>
  </div>

  <div class="card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h2 class="closed-title">このページは閉鎖されました</h2>

    <p class="closed-desc">
      マリーズバースデーイベントは終了しました。<br>
      ご参加いただいた方、ありがとうございました。<br><br>
      このページは現在ご利用いただけません。
    </p>

    <div class="deco-border"></div>

    <p class="thanks-text">
      ホテルオハラに来てくれて<br>
      本当にありがとう！<br>
      また会いましょう♪<br><br>
      — 鞠莉より
    </p>
  </div>

  <div class="logo-area">©2017 PLIS</div>

</div>

<script>
  // 星を生成（少なめ・控えめ）
  const starsContainer = document.getElementById('starsContainer');
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${Math.random()*4+3}s;--delay:${Math.random()*5}s;`;
    starsContainer.appendChild(star);
  }
</script>
</body>
</html>
